name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run the regression suite
        run: python -m pytest tests/ -v

      # These guard the dataset's integrity, not just the code: that the
      # reported reliability figures are reproducible from committed data and
      # that the published schema matches what the engine emits.
      - name: Reproduce the reliability figures
        run: python validation/apply_decision_rules.py --boot 200

      - name: Validate the data package schema
        run: |
          python -c "
          import json, sys
          pkg = json.load(open('datapackage.json'))
          assert pkg['resources'], 'no resources declared'
          for r in pkg['resources']:
              assert r['schema']['fields'], f\"{r['name']} has no fields\"
          print(f\"datapackage.json OK: {len(pkg['resources'])} resources\")
          "
